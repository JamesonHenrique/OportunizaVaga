name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Glob por git ls-files: lista escrita à mão desatualiza e o job passa a
      # aceitar arquivo novo sem checar. Nada de hardcode aqui — a lista cresce junto.
      - name: bash -n (toda a arvore .sh versionada)
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          ((${#files[@]})) || { echo 'nenhum .sh versionado'; exit 1; }
          for f in "${files[@]}"; do bash -n "$f"; done
          echo "bash -n OK: ${#files[@]} arquivos"
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: error
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: node --check (monitor/*.mjs)
        run: |
          for f in monitor/*.mjs; do node --check "$f"; done
      - name: JSON válido (todo .json versionado, menos lockfile)
        run: |
          mapfile -t files < <(git ls-files '*.json' | grep -v 'package-lock\.json$')
          ((${#files[@]})) || { echo 'nenhum .json versionado'; exit 1; }
          for f in "${files[@]}"; do python3 -m json.tool "$f" > /dev/null; done
          echo "JSON OK: ${#files[@]} arquivos"
      - name: python compile (todo .py versionado)
        run: |
          mapfile -t files < <(git ls-files '*.py')
          ((${#files[@]})) || { echo 'nenhum .py versionado'; exit 1; }
          for f in "${files[@]}"; do python3 -m py_compile "$f"; done
          echo "py_compile OK: ${#files[@]} arquivos"
      - name: validate (schemas)
        run: bash scripts/validate.sh
      - name: suite bash (TAP)
        run: |
          mapfile -t files < <(git ls-files 'tests/test_*.sh')
          ((${#files[@]})) || { echo 'nenhum tests/test_*.sh versionado'; exit 1; }
          for t in "${files[@]}"; do echo "== $t"; bash "$t"; done
          echo "suite bash OK: ${#files[@]} arquivos"
      - name: node --test monitor/
        run: node --test monitor/*.test.mjs
      - name: sanitize (sem segredos/dados pessoais)
        run: ./scripts/sanitize.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer (só erros)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule 'PS*' -Severity Error
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
          Write-Host 'PSScriptAnalyzer: nenhum erro.'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: node --check (monitor/*.mjs)
        shell: pwsh
        run: |
          Get-ChildItem monitor/*.mjs | ForEach-Object { node --check $_.FullName }
      - name: JSON válido
        shell: pwsh
        run: |
          Get-ChildItem config/sites_permitidos.json, monitor/package.json, monitor/vercel.json, examples/*.example.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }
      - name: validate (schemas)
        shell: pwsh
        run: |
          .\scripts\validate.ps1
      - name: Pester (tests/*.Tests.ps1)
        shell: pwsh
        run: |
          # Glob por Get-ChildItem: suite nova entra sozinha, sem editar o workflow.
          $suites = Get-ChildItem tests/*.Tests.ps1
          if (-not $suites) { Write-Error 'nenhum tests/*.Tests.ps1'; exit 1 }
          $falhou = $false
          foreach ($s in $suites) {
            Write-Host "== $($s.Name)"
            $r = Invoke-Pester -Path $s.FullName -PassThru
            if ($r.FailedCount -gt 0) { $falhou = $true }
          }
          if ($falhou) { exit 1 }
          Write-Host "Pester OK: $($suites.Count) suítes"
      - name: sanitize via git-bash
        shell: bash
        run: ./scripts/sanitize.sh

  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: next build (painel + /api/status)
        run: npx next build
      - name: demo responde com dados fictícios
        run: |
          MONITOR_DEMO=1 npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/status -o /tmp/s.json && break; sleep 1; done
          node -e "const s=require('/tmp/s.json'); if(!s._demo||!s.applied.length) process.exit(1); console.log('demo ok:', s.applied.length, 'candidaturas')"
