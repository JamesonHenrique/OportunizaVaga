name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: bash -n (scripts intocados + espelhos não quebram nada)
        run: |
          bash -n bot/loop.sh
          bash -n bot/dry-run.sh
          bash -n bot/guardiao.sh
          bash -n bot/followup.sh
          bash -n bot/tg-garimpo.sh
          bash -n scripts/validate-rodada.sh
          bash -n bot/sites/lib.sh
          for f in bot/sites/*.sh; do bash -n "$f"; done
          bash -n scripts/monitor-keepalive.sh
          bash -n scripts/pull-monitor.sh
          bash -n scripts/setup.sh
          bash -n scripts/sanitize.sh
          bash -n scripts/digest.sh
          bash -n scripts/notificar.sh
          bash -n scripts/backup-jsons.sh
          bash -n browser/chrome-real.sh
      - name: shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          severity: error
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: node --check (monitor/*.mjs)
        run: |
          for f in monitor/*.mjs; do node --check "$f"; done
      - name: JSON válido
        run: |
          python3 -m json.tool config/sites_permitidos.json > /dev/null
          python3 -m json.tool monitor/package.json > /dev/null
          python3 -m json.tool monitor/vercel.json > /dev/null
          python3 -m json.tool examples/dados_candidato.example.json > /dev/null
          python3 -m json.tool examples/aplicadas.example.json > /dev/null
          python3 -m json.tool config/aplicadas.schema.json > /dev/null
      - name: python compile (bot/*.py)
        run: |
          python3 -m py_compile bot/estado.py
          python3 -m py_compile bot/arquivar-logs-rodada.py
          python3 -m py_compile bot/rodizio-saude.py
          python3 -m py_compile bot/perfil_render.py
          python3 -m py_compile bot/jsonlock.py
          python3 -m py_compile bot/prompt_cond.py
          python3 -m py_compile bot/redact-logs.py
          python3 -m py_compile bot/podar-sessoes.py
      - name: validate (schemas + novos .sh)
        run: |
          bash -n bot/dry-run.sh
          bash -n bot/doctor.sh
          bash -n scripts/validate.sh
          bash -n bot/chrome-lock.sh
          bash scripts/validate.sh
      - name: suite bash (TAP)
        run: |
          bash tests/test_validate.sh
          bash tests/test_dry_run.sh
          bash tests/test_estado.sh
          bash tests/test_rodizio_saude.sh
          bash tests/test_perfil_render.sh
          bash tests/test_jsonlock.sh
          bash tests/test_prompt_cond.sh
          bash tests/test_chrome_lock.sh
          bash tests/test_redact_logs.sh
          bash tests/test_podar_sessoes.sh
          bash tests/test_ctl.sh
      - name: node --test monitor/
        run: node --test monitor/*.test.mjs
      - name: sanitize (sem segredos/dados pessoais)
        run: ./scripts/sanitize.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer (só erros)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -IncludeRule 'PS*' -Severity Error
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }
          Write-Host 'PSScriptAnalyzer: nenhum erro.'
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: node --check (monitor/*.mjs)
        shell: pwsh
        run: |
          Get-ChildItem monitor/*.mjs | ForEach-Object { node --check $_.FullName }
      - name: JSON válido
        shell: pwsh
        run: |
          Get-ChildItem config/sites_permitidos.json, monitor/package.json, monitor/vercel.json, examples/*.example.json | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }
      - name: validate (schemas)
        shell: pwsh
        run: |
          .\scripts\validate.ps1
      - name: Pester (tests/validate.Tests.ps1)
        shell: pwsh
        run: |
          $r = Invoke-Pester -Path ./tests/validate.Tests.ps1 -PassThru
          if ($r.FailedCount -gt 0) { exit 1 }
      - name: sanitize via git-bash
        shell: bash
        run: ./scripts/sanitize.sh

  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: next build (painel + /api/status)
        run: npx next build
      - name: demo responde com dados fictícios
        run: |
          MONITOR_DEMO=1 npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3100/api/status -o /tmp/s.json && break; sleep 1; done
          node -e "const s=require('/tmp/s.json'); if(!s._demo||!s.applied.length) process.exit(1); console.log('demo ok:', s.applied.length, 'candidaturas')"
