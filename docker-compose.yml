# Demo with FICTIONAL data — never mounts your real bot/ directory.
# MONITOR_DEMO=1 makes /api/status serve monitor/demo.mjs (invented companies,
# dates relative to now). examples/ is still copied so snapshot.mjs has a root.
services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /work/monitor
    ports:
      - "3000:3000"
    volumes:
      - ./examples:/demo:ro
    environment:
      CANDIDATURAS_ROOT: /tmp/demo
      MONITOR_DEMO: "1"
    command: >
      sh -c "mkdir -p /tmp/demo
      && cp /demo/aplicadas.example.json /tmp/demo/aplicadas.json
      && npm install && npm run dev"
